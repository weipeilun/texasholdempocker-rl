# train_splendor.py 参数搜索（同 config/test_train.yml）：列表参数每个 loop 随机取一个值，覆盖 config/splendor_default.yml
num_choices: 10

num_iterations: 30
num_samples_per_game: [3, 5, 10]
train_sample_reuse: [1.2, 2.0, 4.0]
mcts_full_search_prob: [0.04, 0.06, 0.1]
num_mcts_simulation_per_step: [64, 128]
mcts_value_scale: [0.1, 0.3]

model_param_dict:
    embedding_dim: [256, 384]
    num_layers: [4, 6]
    learning_rate: [0.0001, 0.0002, 0.0004]
    weight_decay: [0.05, 0.1]
